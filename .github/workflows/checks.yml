name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: VERSION is semver
        run: grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION
      - name: No teacher files tracked
        run: |
          grep -qxF '.local/*' .gitignore
          grep -qxF '!.local/.gitkeep' .gitignore
          test "$(git ls-files .local)" = .local/.gitkeep
      - name: Skill names match folders, descriptions fit
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          failed = False
          for path in [pathlib.Path("SKILL.md"), *sorted(pathlib.Path("skills").glob("*/SKILL.md"))]:
              front = path.read_text().split("---")[1]
              name = re.search(r"^name: (.+)$", front, re.M).group(1).strip()
              description = re.search(r"^description: (.+)$", front, re.M).group(1).strip().strip('"')
              folder = "course-material" if path.parent == pathlib.Path(".") else path.parent.name
              if name != folder:
                  print(f"{path}: name {name} isn't {folder}"); failed = True
              if len(description) >= 1024:
                  print(f"{path}: description has {len(description)} characters"); failed = True
          sys.exit(failed)
          PY
      - name: Named reference files exist
        run: |
          missing=0
          for file in $(grep -ohE 'references/[A-Za-z0-9_/.-]+\.md' SKILL.md skills/*/SKILL.md $(git ls-files 'references/*.md') | sort -u); do
            test -f "$file" || { echo "missing: $file"; missing=1; }
          done
          exit $missing
      - name: Guidance points cite their sources
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          failed = False
          key = re.compile(r"\[([A-Za-z][A-Za-z0-9-]*)\](?!\()")
          for path in sorted(pathlib.Path("references/guidance").glob("*.md")):
              text = re.sub(r"`[^`]*`", "", path.read_text())
              body, _, sources = text.partition("\n## Sources\n")
              defined = set(re.findall(r"^- \[([^\]]+)\]", sources, re.M))
              used = set(key.findall(body))
              section = None
              for line in body.splitlines():
                  if line.startswith("## "):
                      section = line[3:]
                  elif section == "What to check" and line.startswith("- ") and not key.search(line) and "(editorial" not in line:
                      print(f"{path}: point without a source key: {line[:60]}"); failed = True
              for k in sorted(used - defined):
                  print(f"{path}: key [{k}] not in Sources"); failed = True
              for k in sorted(defined - used):
                  print(f"{path}: source [{k}] never used"); failed = True
          sys.exit(failed)
          PY
      - name: Shell scripts parse
        run: for script in setup/*.sh; do bash -n "$script"; done
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem setup/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | Format-List; exit 1 }
          }

  # Links into scratch folders, so nothing outside the runner's temp folder changes.
  linker-unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Link task skills
        run: |
          root="$RUNNER_TEMP/skills"
          other="$RUNNER_TEMP/other/skills/course-material-link-check"
          mkdir -p "$root" "$other" && touch "$other/SKILL.md"
          ln -s "$other" "$root/course-material-link-check"
          bash setup/link-task-skills.sh "$root" 2> err.txt
          for task_skill in skills/*/; do test -f "$root/$(basename "$task_skill")/SKILL.md"; done
          test "$(readlink "$root/course-material-link-check")" = "$other"
          grep -q 'another repository' err.txt
          bash setup/link-task-skills.sh "$root" "$GITHUB_WORKSPACE"

  linker-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Link task skills
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'skills'
          & .\setup\link-task-skills.ps1 -SkillsRoot $root
          & .\setup\link-task-skills.ps1 -SkillsRoot $root -RepoDir $env:GITHUB_WORKSPACE
          foreach ($taskSkill in Get-ChildItem -Directory skills) {
            if (-not (Test-Path (Join-Path $root "$($taskSkill.Name)\SKILL.md"))) { throw "$($taskSkill.Name) isn't linked" }
          }
